  <rect width="1000" height="230" rx="20" fill="url(#bg)"/>
  <rect width="1000" height="230" rx="20" fill="url(#grid)"/>
  <rect width="1000" height="230" rx="20" fill="url(#glowA)"/>
  <rect width="1000" height="230" rx="20" fill="url(#glowB)"/>
