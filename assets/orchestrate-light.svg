  <text x="500" y="78" text-anchor="middle" font-family="ui-sans-serif,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#0b0f19">#27</text>
