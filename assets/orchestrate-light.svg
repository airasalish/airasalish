<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="HackerRank Orchestrate 2026 ranks: June #206 (top 11.6%), August #27 (top 1.4%), September #84 (top 2.7%).">
  <style>
    .draw{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 2s ease-out forwards}
