    </radialGradient>
    <radialGradient id="glowB" cx="0.1" cy="1" r="0.5">
      <stop offset="0" stop-color="#9b4dde" stop-opacity="0.16"/><stop offset="1" stop-color="#9b4dde" stop-opacity="0"/>
    </radialGradient>
