<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="Aira K. Salish: I build AI that's right more often.">
  <style>
    .node{fill:#0f9d6e;animation:pulse 3.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
    .edge{stroke:#3b6fe0;stroke-opacity:.45;stroke-width:1.4;stroke-dasharray:4 6;animation:flow 2.6s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-20}}
    .cursor{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .rise{animation:rise .9s ease-out both}
    .d2{animation-delay:.15s}.d3{animation-delay:.3s}.d4{animation-delay:.45s}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#e8eefb"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f9d6e"><animate attributeName="stop-color" values="#0f9d6e;#3b6fe0;#9b4dde;#0f9d6e" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#3b6fe0"><animate attributeName="stop-color" values="#3b6fe0;#9b4dde;#0f9d6e;#3b6fe0" dur="9s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#0b0f19" stroke-opacity="0.05"/>
    </pattern>
    <radialGradient id="glowA" cx="0.85" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#3b6fe0" stop-opacity="0.25"/><stop offset="1" stop-color="#3b6fe0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.1" cy="1" r="0.5">
      <stop offset="0" stop-color="#9b4dde" stop-opacity="0.16"/><stop offset="1" stop-color="#9b4dde" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="330" rx="20" fill="url(#bg)"/>
  <rect width="1000" height="330" rx="20" fill="url(#grid)"/>
  <rect width="1000" height="330" rx="20" fill="url(#glowA)"/>
  <rect width="1000" height="330" rx="20" fill="url(#glowB)"/>
  <g><line class="edge" x1="700" y1="70" x2="790" y2="120"/>
<line class="edge" x1="790" y1="120" x2="880" y2="62"/>
<line class="edge" x1="790" y1="120" x2="760" y2="210"/>
<line class="edge" x1="760" y1="210" x2="900" y2="190"/>
<line class="edge" x1="880" y1="62" x2="900" y2="190"/>
<line class="edge" x1="900" y1="190" x2="835" y2="270"/>
<line class="edge" x1="760" y1="210" x2="835" y2="270"/>
<line class="edge" x1="880" y1="62" x2="950" y2="120"/>
<line class="edge" x1="950" y1="120" x2="900" y2="190"/><circle class="node" style="animation-delay:0.00s" cx="700" cy="70" r="5"/>
<circle class="node" style="animation-delay:0.45s" cx="790" cy="120" r="8"/>
<circle class="node" style="animation-delay:0.90s" cx="880" cy="62" r="5"/>
<circle class="node" style="animation-delay:1.35s" cx="760" cy="210" r="6"/>
<circle class="node" style="animation-delay:1.80s" cx="900" cy="190" r="7"/>
<circle class="node" style="animation-delay:2.25s" cx="835" cy="270" r="5"/>
<circle class="node" style="animation-delay:2.70s" cx="950" cy="120" r="4"/></g>
  <text class="rise" x="62" y="66" font-family="ui-monospace,SFMono-Regular,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="14" fill="#0f9d6e" letter-spacing="2">~/airasalish $ whoami</text>
  <text class="rise d2" x="58" y="138" font-family="ui-sans-serif,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="64" font-weight="800" fill="url(#ink)">Aira K. Salish</text>
  <text class="rise d3" x="62" y="184" font-family="ui-sans-serif,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#0b0f19">I build AI that's right more often, and prove it with tests.</text>
  <text class="rise d4" x="62" y="222" font-family="ui-monospace,SFMono-Regular,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="14" fill="#5b6682">AI/ML @ SRM Chennai · Class of 2027 · agents · evals · fintech<tspan class="cursor" fill="#0f9d6e"> ▍</tspan></text>
  <g transform="translate(60,262)"><rect width="160" height="30" rx="15" fill="#ffffff" fill-opacity="0.75" stroke="#d5dcec"/><text x="80" y="20" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="12.5" fill="#2b3550">AWS AI Practitioner</text></g><g transform="translate(230,262)"><rect width="115" height="30" rx="15" fill="#ffffff" fill-opacity="0.75" stroke="#d5dcec"/><text x="57" y="20" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="12.5" fill="#2b3550">SAP Certified</text></g><g transform="translate(355,262)"><rect width="153" height="30" rx="15" fill="#ffffff" fill-opacity="0.75" stroke="#d5dcec"/><text x="76" y="20" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="12.5" fill="#2b3550">Citi Bridge Top 5%</text></g><g transform="translate(518,262)"><rect width="183" height="30" rx="15" fill="#ffffff" fill-opacity="0.75" stroke="#d5dcec"/><text x="92" y="20" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="12.5" fill="#2b3550">#27 / 1,983 HackerRank</text></g>
</svg>
