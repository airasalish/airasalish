<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Aira Salish — AI/ML engineer who ships evaluated, explainable systems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#eaf0fb"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12b886">
        <animate attributeName="stop-color" values="#12b886;#3b6fe0;#9b4dde;#12b886" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#3b6fe0">
        <animate attributeName="stop-color" values="#3b6fe0;#9b4dde;#12b886;#3b6fe0" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#0b0f19" stroke-opacity="0.05"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#3b6fe0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3b6fe0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .t{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
    .node{animation:pulse 3s ease-in-out infinite}
    .n2{animation-delay:.6s}.n3{animation-delay:1.2s}.n4{animation-delay:1.8s}.n5{animation-delay:2.4s}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .edge{stroke-dasharray:4 6;animation:flow 2.4s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-20}}
    .cursor{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>
  <rect width="900" height="240" rx="18" fill="url(#bg)"/>
  <rect width="900" height="240" rx="18" fill="url(#grid)"/>
  <rect width="900" height="240" rx="18" fill="url(#glow)"/>

  <!-- small "network" motif -->
  <g stroke="#3b6fe0" stroke-opacity="0.5" fill="none" stroke-width="1.4">
    <path class="edge" d="M640 70 L720 110 L800 64"/>
    <path class="edge" d="M720 110 L700 180 L810 170"/>
    <path class="edge" d="M800 64 L810 170"/>
  </g>
  <g fill="#0f9d6e">
    <circle class="node" cx="640" cy="70" r="5"/>
    <circle class="node n2" cx="720" cy="110" r="7"/>
    <circle class="node n3" cx="800" cy="64" r="5"/>
    <circle class="node n4" cx="700" cy="180" r="5"/>
    <circle class="node n5" cx="810" cy="170" r="6"/>
  </g>

  <text x="56" y="62" class="m" font-size="14" fill="#0f9d6e" letter-spacing="2">~/airasalish $ whoami</text>
  <text x="54" y="122" class="t" font-size="54" font-weight="800" fill="url(#ink)">Aira Salish</text>
  <text x="56" y="160" class="t" font-size="19" fill="#2b3550">AI/ML engineer · I ship systems that show their receipts.</text>
  <text x="56" y="198" class="m" font-size="13" fill="#5b6682">evaluated · explainable · deployed<tspan class="cursor" fill="#0f9d6e"> ▍</tspan></text>
</svg>
