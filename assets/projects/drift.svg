<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-label="DRIFT: Know what changed since you last looked">
  <style>
    .draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 2.2s ease-out .2s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .bar{transform-box:fill-box;transform-origin:bottom;animation:grow .9s ease-out both}
    @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070a12"/><stop offset="1" stop-color="#003d2c"/></linearGradient>
    <pattern id="d" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".07"/></pattern>
  </defs>
  <rect width="640" height="240" rx="16" fill="url(#g)"/>
  <rect width="640" height="240" rx="16" fill="url(#d)"/>
  <text x="32" y="46" font-family="ui-monospace,SFMono-Regular,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="12" letter-spacing="2" fill="#2ee6a6">CODE, BY GROWW 2026</text>
  <text x="30" y="104" font-family="ui-sans-serif,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="900" fill="#ffffff">DRIFT</text>
  <text x="32" y="138" font-family="ui-sans-serif,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#dfe6f5">Know what changed since you last looked</text>
  <rect x="32" y="166" width="246" height="30" rx="15" fill="#2ee6a6" fill-opacity=".14" stroke="#2ee6a6" stroke-opacity=".6"/>
  <text x="44" y="186" font-family="ui-monospace,SFMono-Regular,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="12.5" fill="#2ee6a6">121 tests · 191 commits · live</text>
  <path class="draw" d="M440 180 L478 150 L506 160 L536 110 L560 124 L600 60" fill="none" stroke="#2ee6a6" stroke-width="4" stroke-linejoin="round"/><circle cx="600" cy="60" r="7" fill="#2ee6a6"><animate attributeName="r" values="6;11;6" dur="2s" repeatCount="indefinite"/></circle><line x1="440" y1="196" x2="606" y2="196" stroke="#2ee6a6" stroke-opacity=".35" stroke-width="2"/>
</svg>
