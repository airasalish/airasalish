<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-label="AIRA: One prompt. Full campaign. Under 30 s.">
  <style>
    .draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 2.2s ease-out .2s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .bar{transform-box:fill-box;transform-origin:bottom;animation:grow .9s ease-out both}
    @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070a12"/><stop offset="1" stop-color="#35105a"/></linearGradient>
    <pattern id="d" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".07"/></pattern>
  </defs>
  <rect width="640" height="240" rx="16" fill="url(#g)"/>
  <rect width="640" height="240" rx="16" fill="url(#d)"/>
  <text x="32" y="46" font-family="ui-monospace,SFMono-Regular,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="12" letter-spacing="2" fill="#d59bff">XENO INTERNSHIP CHALLENGE 2026</text>
  <text x="30" y="104" font-family="ui-sans-serif,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="900" fill="#ffffff">AIRA</text>
  <text x="32" y="138" font-family="ui-sans-serif,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#dfe6f5">One prompt. Full campaign. Under 30 s.</text>
  <rect x="32" y="166" width="246" height="30" rx="15" fill="#d59bff" fill-opacity=".14" stroke="#d59bff" stroke-opacity=".6"/>
  <text x="44" y="186" font-family="ui-monospace,SFMono-Regular,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="12.5" fill="#d59bff">Llama 3.3 70B · live analytics</text>
  <circle cx="526" cy="124" r="20" fill="none" stroke="#d59bff" stroke-width="2"><animate attributeName="r" values="18;78" dur="3s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="3s" begin="0s" repeatCount="indefinite"/></circle><circle cx="526" cy="124" r="20" fill="none" stroke="#d59bff" stroke-width="2"><animate attributeName="r" values="18;78" dur="3s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="3s" begin="1s" repeatCount="indefinite"/></circle><circle cx="526" cy="124" r="20" fill="none" stroke="#d59bff" stroke-width="2"><animate attributeName="r" values="18;78" dur="3s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="3s" begin="2s" repeatCount="indefinite"/></circle><circle cx="526" cy="124" r="14" fill="#d59bff"/>
</svg>
