<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-label="TRAVERSE: Survey-grade area &amp; length from any shapefile">
  <style>
    .draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 2.2s ease-out .2s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .bar{transform-box:fill-box;transform-origin:bottom;animation:grow .9s ease-out both}
    @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070a12"/><stop offset="1" stop-color="#4d1a00"/></linearGradient>
    <pattern id="d" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".07"/></pattern>
  </defs>
  <rect width="640" height="240" rx="16" fill="url(#g)"/>
  <rect width="640" height="240" rx="16" fill="url(#d)"/>
  <text x="32" y="46" font-family="ui-monospace,SFMono-Regular,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="12" letter-spacing="2" fill="#ff8a5b">GEOSPATIAL API</text>
  <text x="30" y="104" font-family="ui-sans-serif,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="900" fill="#ffffff">TRAVERSE</text>
  <text x="32" y="138" font-family="ui-sans-serif,-apple-system,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#dfe6f5">Survey-grade area &amp; length from any shapefile</text>
  <rect x="32" y="166" width="179" height="30" rx="15" fill="#ff8a5b" fill-opacity=".14" stroke="#ff8a5b" stroke-opacity=".6"/>
  <text x="44" y="186" font-family="ui-monospace,SFMono-Regular,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="12.5" fill="#ff8a5b">error ≈ 1 part in 10⁹</text>
  <polygon class="draw" points="460,150 500,60 580,74 606,160 530,194" fill="#ff8a5b" fill-opacity=".12" stroke="#ff8a5b" stroke-width="3"/><circle cx="460" cy="150" r="6" fill="#ff8a5b"/><circle cx="500" cy="60" r="6" fill="#ff8a5b"/><circle cx="580" cy="74" r="6" fill="#ff8a5b"/><circle cx="606" cy="160" r="6" fill="#ff8a5b"/><circle cx="530" cy="194" r="6" fill="#ff8a5b"/>
</svg>
