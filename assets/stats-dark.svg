    </radialGradient>
    <radialGradient id="glowB" cx="0.1" cy="1" r="0.5">
      <stop offset="0" stop-color="#d59bff" stop-opacity="0.16"/><stop offset="1" stop-color="#d59bff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="250" rx="20" fill="url(#bg)"/>
