<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="By the numbers: #27 of 1,983 at HackerRank Orchestrate; 35% fewer wrong answers in a live AI product; 20M views on one AI short; zero wrong committed calls on Warrant; top 5% at Citi Bridge; 3 live products.">
  <style>
